name: Android Debug Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  ANDROID_BUILD_TOOLS: "35.0.1"
  ANDROID_PLATFORM: "35"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache unduhan Godot
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Pasang Godot dan export template
        run: bash tools/ci/install_godot.sh

      - name: Siapkan Android SDK dan keystore debug
        run: bash tools/ci/setup_android.sh

      - name: Validasi proyek
        run: bash tools/ci/validate.sh

      - name: Ekspor APK debug
        run: bash tools/ci/export_apk.sh

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "## Android Debug Build"
            echo "- Godot: $(godot --version 2>/dev/null || echo tidak terpasang)"
            if [ -s build/tabib-tradisional-debug.apk ]; then
              echo "- APK: dibuat, $(stat -c%s build/tabib-tradisional-debug.apk) byte"
              echo "- SHA-256: \`$(sha256sum build/tabib-tradisional-debug.apk | cut -d' ' -f1)\`"
            else
              echo "- APK: **tidak dibuat**"
            fi
            echo "- **Belum diuji di perangkat Android.** Build berhasil tidak berarti aplikasi sudah teruji."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabib-tradisional-debug-apk
          path: build/tabib-tradisional-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Unggah log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14
